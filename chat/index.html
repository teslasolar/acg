<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ACG Chat</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <!-- Top Bar -->
    <header class="topbar">
      <h1>ACG Chat <span style="font-size:14px">&#9874;</span></h1>
      <div class="topbar-actions">
        <span class="status-dot" id="status-dot" title="Online"></span>
        <span class="peer-count" id="peer-count"></span>
        <div class="user-badge" id="user-badge">
          <span class="user-dot" id="user-dot"></span>
          <span id="user-name">Loading...</span>
        </div>
        <button class="btn btn-wb" id="whiteboard-toggle" title="Whiteboard">Board</button>
        <button class="btn btn-media" id="media-toggle" title="Camera & Screen Share">Media</button>
        <button class="btn btn-ai" id="ai-panel-toggle" title="AI Assistant (runs locally)">AI</button>
        <button class="btn btn-console" id="console-toggle" title="Console">Console</button>
        <button class="btn" id="settings-btn" title="Settings">Settings</button>
      </div>
    </header>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-title">Rooms</div>
        <div id="room-list"></div>
        <button class="btn" id="create-room-btn" style="margin-top:8px;width:100%">+ New Room</button>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-title">Channels</div>
        <div id="channel-list"></div>
      </div>
      <div class="sidebar-section" style="margin-top:auto;padding-bottom:16px">
        <button class="btn" id="export-btn" style="width:100%;margin-bottom:6px">Export Data</button>
        <button class="btn" id="import-btn" style="width:100%">Import Backup</button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main">
      <div class="channel-header" id="channel-header">Select a room to start chatting</div>

      <div class="message-list" id="message-list">
        <div class="empty-state">Join or create a room to start chatting.</div>
      </div>

      <!-- Compose -->
      <div class="compose">
        <div class="compose-reply" id="reply-indicator">
          <span id="reply-text"></span>
          <button id="cancel-reply">Cancel</button>
        </div>
        <div class="compose-row">
          <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off">
          <label class="ai-label" title="Mark this message as AI-assisted (ACG Transparency)">
            <input type="checkbox" id="ai-toggle"> AI
          </label>
          <button class="send-btn" id="send-btn">Send</button>
        </div>
      </div>
    </main>
  </div>

  <!-- Settings Modal -->
  <div class="modal-overlay hidden" id="settings-modal">
    <div class="modal">
      <h2>Settings</h2>
      <label>Display Name</label>
      <input type="text" id="settings-name" placeholder="Your name">
      <label>Color</label>
      <input type="color" id="settings-color" value="#6366f1">
      <label>
        <input type="checkbox" id="settings-signing"> Enable message signing
      </label>
      <div class="modal-actions">
        <button class="btn btn-danger" id="settings-delete-data">Delete All Data</button>
        <button class="btn" id="settings-cancel">Cancel</button>
        <button class="btn btn-primary" id="settings-save">Save</button>
      </div>
    </div>
  </div>

  <!-- Create Room Modal -->
  <div class="modal-overlay hidden" id="create-room-modal">
    <div class="modal">
      <h2>Create Room</h2>
      <label>Room Name</label>
      <input type="text" id="new-room-name" placeholder="my-room">
      <label>Description (optional)</label>
      <input type="text" id="new-room-desc" placeholder="What's this room about?">
      <div class="modal-actions">
        <button class="btn" id="create-room-cancel">Cancel</button>
        <button class="btn btn-primary" id="create-room-confirm">Create</button>
      </div>
    </div>
  </div>

  <!-- Whiteboard Panel -->
  <aside class="wb-panel" id="whiteboard-panel">
    <div class="wb-header">
      <span class="wb-title">Whiteboard</span>
      <span class="wb-badge">P2P Sync</span>
      <div class="wb-tools">
        <button class="btn wb-tool active" data-wb-tool="pen" title="Pen">&#9999;</button>
        <button class="btn wb-tool" data-wb-tool="eraser" title="Eraser">&#9003;</button>
        <button class="btn wb-tool" data-wb-tool="line" title="Line">&#9585;</button>
        <button class="btn wb-tool" data-wb-tool="rect" title="Rectangle">&#9634;</button>
        <button class="btn wb-tool" data-wb-tool="ellipse" title="Ellipse">&#9711;</button>
        <button class="btn wb-tool" data-wb-tool="text" title="Text (double-click)">T</button>
        <input type="color" id="wb-color" value="#e4e6ed" title="Color">
        <input type="range" id="wb-width" min="1" max="20" value="2" title="Brush size">
        <button class="btn" id="wb-undo" title="Undo">&#8630;</button>
        <button class="btn btn-danger" id="wb-clear" title="Clear All">Clear</button>
      </div>
      <button class="wb-close" id="whiteboard-close">&times;</button>
    </div>
    <div class="wb-canvas-container" id="wb-canvas-container"></div>
  </aside>

  <!-- Media Panel -->
  <aside class="media-panel" id="media-panel">
    <div class="media-header">
      <span class="media-title">Media</span>
      <div class="media-actions">
        <button class="btn btn-primary" id="media-cam-btn">Camera</button>
        <button class="btn btn-primary" id="media-screen-btn">Screen Share</button>
        <button class="btn btn-danger" id="media-stop-btn" style="display:none">Stop All</button>
      </div>
      <button class="media-close" id="media-close">&times;</button>
    </div>
    <div class="media-grid" id="media-grid"></div>
  </aside>

  <!-- AI Assistant Panel -->
  <aside class="ai-panel" id="ai-panel">
    <div class="ai-panel-header">
      <span class="ai-panel-title">AI Assistant</span>
      <span class="ai-panel-badge">On-Device</span>
      <button class="ai-panel-close" id="ai-panel-close">&times;</button>
    </div>
    <div class="ai-status" id="ai-status">
      <span class="ai-status-info">SmolLM2-360M &mdash; runs entirely in your browser via WebGPU. No data leaves your device.</span>
    </div>
    <div class="ai-panel-actions">
      <button class="btn btn-primary" id="ai-load-btn">Load Model</button>
      <button class="btn btn-danger" id="ai-unload-btn">Unload</button>
    </div>
    <div class="ai-messages" id="ai-messages"></div>
    <div class="ai-compose">
      <input type="text" id="ai-input" placeholder="Ask the AI anything..." autocomplete="off" disabled>
      <button class="send-btn" id="ai-send-btn" disabled>Send</button>
    </div>
    <button class="btn" id="ai-send-to-chat" style="display:none">Send last response to chat</button>
  </aside>

  <!-- Console Panel -->
  <aside class="console-panel" id="console-panel">
    <div class="console-header">
      <span class="console-title">Console</span>
      <div class="console-actions">
        <button class="btn" id="console-export" title="Export logs">Export</button>
        <button class="btn" id="console-clear" title="Clear">Clear</button>
      </div>
    </div>
    <div class="console-output" id="console-output"></div>
  </aside>

  <!-- No-JS fallback -->
  <noscript>
    <style>.app{display:none}</style>
    <div style="padding:40px;text-align:center;color:#e4e6ed;font-family:sans-serif">
      <h1>ACG Chat</h1>
      <p>JavaScript is required for the chat application.</p>
      <p>Enable JavaScript to join the conversation.</p>
    </div>
  </noscript>

  <script type="module" src="js/app.js"></script>
</body>
</html>
